name: Grade finished games
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be graded, change nothing)'
        type: boolean
        default: false
jobs:
  grade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pandas
      - run: python auto_grade.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BENCH_CONTACT: ${{ secrets.BENCH_CONTACT }}
